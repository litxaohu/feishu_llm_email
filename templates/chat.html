<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XiaoHu Chat Console</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 28, 48, 0.88);
      --panel-2: rgba(11, 21, 38, 0.96);
      --border: rgba(98, 140, 255, 0.18);
      --text: #e8f0ff;
      --muted: #8fa8d6;
      --accent: #5cc8ff;
      --accent-2: #7d6bff;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(92, 200, 255, 0.16), transparent 24%),
        radial-gradient(circle at top right, rgba(125, 107, 255, 0.16), transparent 26%),
        linear-gradient(180deg, #07111f 0%, #050b16 100%);
      min-height: 100vh;
    }
    .shell { max-width: 1280px; margin: 0 auto; padding: 28px; }
    .hero { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; margin-bottom: 18px; }
    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(92, 200, 255, 0.08);
      color: var(--accent);
      font-size: 13px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .hero h1 { margin: 0; font-size: 32px; }
    .hero p { margin: 8px 0 0; color: var(--muted); }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .flash {
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(92, 200, 255, 0.22);
      background: rgba(92, 200, 255, 0.08);
      color: #dff6ff;
    }
    .chat-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    textarea {
      width: 100%;
      min-height: 440px;
      resize: vertical;
      border-radius: 16px;
      border: 1px solid rgba(129, 155, 255, 0.22);
      background: rgba(9, 18, 32, 0.85);
      color: var(--text);
      padding: 14px 16px;
      outline: none;
      font-family: inherit;
      line-height: 1.6;
    }
    .chat-box {
      min-height: 440px;
      white-space: pre-wrap;
      border-radius: 16px;
      border: 1px solid rgba(129, 155, 255, 0.18);
      padding: 16px;
      background: rgba(3, 10, 20, 0.55);
      overflow: auto;
      line-height: 1.65;
    }
    button, .button-link {
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }
    .button-link.secondary {
      background: rgba(111, 137, 194, 0.16);
      border: 1px solid rgba(111, 137, 194, 0.22);
      color: var(--text);
    }
    .micro { font-size: 12px; color: var(--muted); }
    @media (max-width: 980px) {
      .chat-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <div class="badge">XiaoHu AI Chat Workspace</div>
        <h1>独立 AI 对话窗口</h1>
        <p>支持普通提问，以及 `[邮件]`、`[案例贡献]` 等指令，适合集中调试对话能力。</p>
      </div>
      <a class="button-link secondary" href="/">返回控制中心</a>
    </div>

    {% if message %}
    <div class="flash">{{ message }}</div>
    {% endif %}

    <div class="card">
      <div class="toolbar">
        <div class="micro">提示：可直接输入普通问题，或输入 `[邮件]` / `[案例贡献]` 指令。</div>
      </div>
      <form action="/chat" method="post">
        <div class="chat-layout">
          <div>
            <div class="micro" style="margin-bottom: 8px;">输入</div>
            <textarea name="chat_input" placeholder="请输入内容...">{{ chat_input }}</textarea>
          </div>
          <div>
            <div class="micro" style="margin-bottom: 8px;">输出</div>
            <div class="chat-box">{{ chat_output or "AI 返回结果会显示在这里。" }}</div>
          </div>
        </div>
        <div class="toolbar" style="margin-top: 14px;">
          <div class="micro">邮件模式建议粘贴完整邮件原文；案例贡献会自动转成 Markdown 并进入后台任务队列。</div>
          <button type="submit">发送到 AI</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
