<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 导入确认</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 28, 48, 0.88);
      --panel-2: rgba(11, 21, 38, 0.96);
      --border: rgba(98, 140, 255, 0.18);
      --text: #e8f0ff;
      --muted: #8fa8d6;
      --accent: #5cc8ff;
      --accent-2: #7d6bff;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(92, 200, 255, 0.16), transparent 24%),
        radial-gradient(circle at top right, rgba(125, 107, 255, 0.16), transparent 26%),
        linear-gradient(180deg, #07111f 0%, #050b16 100%);
      min-height: 100vh;
    }
    .shell { max-width: 980px; margin: 0 auto; padding: 28px; }
    .hero { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; margin-bottom: 18px; }
    .hero h1 { margin: 0; font-size: 30px; }
    .hero p { margin: 8px 0 0; color: var(--muted); }
    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(92, 200, 255, 0.08);
      color: var(--accent);
      font-size: 13px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .meta-grid { display: grid; grid-template-columns: 160px 1fr; gap: 12px; }
    .meta-label { color: var(--muted); }
    .flash {
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(92, 200, 255, 0.22);
      background: rgba(92, 200, 255, 0.08);
      color: #dff6ff;
    }
    textarea, input[type="text"] {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(129, 155, 255, 0.22);
      background: rgba(9, 18, 32, 0.85);
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }
    textarea { min-height: 180px; resize: vertical; }
    button, .button-link {
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }
    .button-link.secondary {
      background: rgba(111, 137, 194, 0.16);
      border: 1px solid rgba(111, 137, 194, 0.22);
      color: var(--text);
    }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .micro { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <div class="badge">HTML Import Review</div>
        <h1>HTML 下载确认与预览</h1>
        <p>下载完成后先预览原始 HTML，再确认解析为 Markdown 并进入后续知识库流程。</p>
      </div>
      <a class="button-link secondary" href="/">返回控制中心</a>
    </div>

    {% if message %}
    <div class="flash">{{ message }}</div>
    {% endif %}

    <div class="card">
      <div class="meta-grid">
        <div class="meta-label">已下载文件</div>
        <div>{{ stored_name }}</div>
        <div class="meta-label">来源链接</div>
        <div>{{ source_url or "未提供" }}</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <a class="button-link" href="{{ preview_url }}" target="_blank" rel="noopener noreferrer">预览下载的 HTML</a>
        <span class="micro">预览会在新标签页打开原始 HTML 内容，确认页面完整无误后再解析保存。</span>
      </div>
    </div>

    <div class="card">
      <h3>确认解析并保存</h3>
      <form action="/confirm-html" method="post">
        <input type="hidden" name="stored_name" value="{{ stored_name }}" />
        <input type="hidden" name="source_url" value="{{ source_url }}" />
        <div class="micro" style="margin-bottom: 10px;">填写这封邮件案例的主要功能、问题背景或处理要点，后续建立记忆时会一并纳入。</div>
        <textarea name="description" placeholder="输入邮件案例描述">{{ description }}</textarea>
        <div class="toolbar" style="margin-top: 14px;">
          <button type="submit">解析并保存</button>
          <a class="button-link secondary" href="/">取消</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
